name: Deploy WeTravel to Oracle Cloud

on:
  push:
    branches:
      - main
      - ansh
    paths:
      - 'backend/**'
      - 'ai/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle Cloud VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🚀 SSH & Auto-Deploy on Oracle VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            echo "=============================================="
            echo "🚀 Starting WeTravel Continuous Deployment..."
            echo "=============================================="

            # 1. Navigate to project root
            cd /home/ubuntu/WeTravel

            # 2. Pull latest code from current branch
            echo "📥 Fetching and checking out branch: ${{ github.ref_name }}..."
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            # 3. Build & restart containers with BuildKit cache resilience
            echo "🐳 Cleaning stale cache & rebuilding Docker services..."
            # Prevent disk exhaustion and corrupt BuildKit snapshots
            docker image prune -f || true

            docker compose down

            # Attempt build; if corrupted snapshot error occurs, auto-prune builder and build with --no-cache
            if ! docker compose build; then
              echo "⚠️ Standard build failed. Clearing corrupted BuildKit cache and retrying with --no-cache..."
              docker builder prune -a -f
              docker compose build --no-cache
            fi

            docker compose up -d

            # 4. Run database migrations automatically
            echo "🗄️ Running Prisma database migrations..."
            docker compose exec -T backend npx prisma migrate deploy || echo "⚠️ Migration completed with warning"

            # 5. Verify running containers
            echo "📊 Verifying running containers..."
            docker compose ps
            echo "=============================================="
            echo "✅ Deployment completed successfully!"
            echo "=============================================="
